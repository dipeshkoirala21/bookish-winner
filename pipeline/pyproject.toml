[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghumante-pipeline"
version = "0.1.0"
description = "Offline data pipeline for Ghumante: OSM + DEM + land cover -> game-ready tiles"
requires-python = ">=3.11"
license = { text = "Proprietary (pipeline method published per ODbL 4.6, see docs/LICENSES.md)" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyproj>=3.6",
  "shapely>=2.1",
  "rasterio>=1.3",
  "osmium>=4.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[tool.setuptools]
packages = ["ghumante_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "realdata: needs downloaded source data in pipeline/data/raw (skipped when absent)",
  "slow: takes more than a few seconds",
]
