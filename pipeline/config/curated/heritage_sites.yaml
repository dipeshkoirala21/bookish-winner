# Curated heritage records: the hero replicas of docs/W2_DESIGN.md section 3.4 (work items D5 + D12).
#
# Compiled by ghumante_pipeline/curated.py into the region's `<region>.curated.ghcd` (DATA_FORMATS
# section 7) and, as a temporary bridge until every reader uses .ghcd, `hero_recipes.json`.
# Stage 1 (`stage: 1`) rows only; stage 2 adds the rest of section 3.4.
#
# Fields
#   id            our id, `her.<town>.<name>`; never reused
#   stage         1 or 2 (W2_DESIGN 10.5)
#   kind          model.HeritageKind (PAGODA, SHIKHARA_STONE, SHIKHARA_PLASTER, STUPA, HOUSE_TEMPLE,
#                 MANDAPA, RELIEF, COLUMN, GATE, PALACE, TOWER, HITI, POKHARI, GOMPA, BAHAL)
#   name_en       English display name (the NE name comes from the OSM anchor's name:ne / name, never
#                 typed here: Devanagari is never machine-made, ADR-005)
#   osm           anchor: "n123" / "w123" / "r123". A node anchor inside a building footprint takes that
#                 footprint as its plan (the building is hidden).
#   manual        {lon, lat, source} only when OSM has no object (55-Window Palace, peacock window)
#   compound      walkable compound / kora area ref (W2-O1): no vehicles, calm mode, courtyard audio
#   hide          extra OSM refs whose buildings are hidden (D5 hide zone = anchor footprint + these)
#   height_m      total height to the finial; plan_m [w, d] footprint estimate when OSM has none
#   tiers, plinth_levels, doors       exact counts (W2_DESIGN 3.1)
#   finish        model.HeritageFinish (TILE, GILT_TOP, GILT_ALL, WHITEWASH, STONE, BRICK, STUCCO, TERRACOTTA)
#   yaw_deg       main door bearing (outward normal, degrees clockwise from north)
#   verify        list of attributes still marked [V] in W2_DESIGN (sets HeritageFlags.VERIFY)
#   deity         dedication (shown on the info card; never an image of a sanctum)
#   entry_rule    model.EntryRule shown as a NON-BLOCKING card (W2-O1)
#   kora          CLOCKWISE / ANTICLOCKWISE / NONE
#   attrs         other generator parameters (strings; HeroBuilder reads what it needs)
#   provenance    sources (docs/research/w2/temples.md section 9 has the URLs)
#   review        cultural sign-off (W2_DESIGN 10.7); "pending" until the reviewer signs
version: 1
defaults:
  provenance: "docs/research/w2/temples.md (T section 3 and 5); docs/W2_DESIGN.md section 3.4"
  review: pending

