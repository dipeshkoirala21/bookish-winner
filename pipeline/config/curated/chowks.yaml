# Police-controlled chowks of the Kathmandu Valley (docs/W2_DESIGN.md section 4.7, work item D18).
#
# Source: docs/research/w2/vehicles_traffic.md section 5.3 (junction nodes measured in OSM;
# Gongabu and Thapathali positions are estimates [E]). Read by ghumante_pipeline/junctions.py:
# each entry is snapped to the junction node with the most motor arms (ties: the higher road
# class, then the nearer node) within `snap_m` of `at`, or to a mapped roundabout ring whose
# centre lies within `snap_m`. The JNCT record gets the HAS_POLICE flag, and OFFICERS_2_4 when
# `officers` is "2-4" (W2_DESIGN 4.7: 1 officer at medium chowks, 2-4 at the big ones).
#
# `at: [lon, lat]` WGS84. `control`: P police, S OSM signals + police, R roundabout + police.
# Names are what the JNCT record shows: English only here, because Devanagari is never machine-made
# (ADR-005); the record's NE name comes from OSM (`name:ne` of the snapped node, else empty).
# Never an operator or brand.
version: 1
snap_m: 120
