  - {relation: 10535034, name: Lalitpur Metropolitan City, profile: METRO}
  - {relation: 7715519, name: Bhaktapur Municipality, profile: METRO}
  - {relation: 7715169, name: Madhyapur Thimi Municipality, profile: METRO}
  - {relation: 12394676, name: Kirtipur Municipality, profile: METRO}
  - {relation: 12394680, name: Tokha, profile: RIM, urban_profile: METRO}
  - {relation: 12394681, name: Budhanilkantha, profile: RIM, urban_profile: METRO}
  - {relation: 12394682, name: Gokarneshwar, profile: RIM, urban_profile: METRO}
  - {relation: 12394679, name: Tarakeshwar, profile: RIM, urban_profile: METRO}
  - {relation: 12394678, name: Nagarjun, profile: RIM, urban_profile: METRO}
  - {relation: 12394675, name: Chandragiri, profile: RIM, urban_profile: METRO}
  - {relation: 12394674, name: Dakshinkali, profile: RIM, urban_profile: METRO}
  - {relation: 10535033, name: Godawari, profile: RIM, urban_profile: METRO}
  - {relation: 10535035, name: Mahalaxmi (OSM name is wrong, CONTENT_COVERAGE P6), profile: RIM, urban_profile: METRO}
  - {relation: 12379739, name: Mahalaxmi, profile: RIM, urban_profile: METRO}
  - {relation: 10534891, name: Changunarayan, profile: RIM, urban_profile: METRO}
  - {relation: 10534890, name: Suryabinayak, profile: RIM, urban_profile: METRO}
  - {relation: 12394684, name: Shankharapur, profile: RIM, urban_profile: METRO}
  - {relation: 10535032, name: Konjyosom, profile: RIM, urban_profile: METRO}
  - {relation: 10535030, name: Bagmati, profile: RIM, urban_profile: METRO}
  - {relation: 10537759, name: Bagmati, profile: RIM, urban_profile: METRO}
  - {relation: 10532308, name: Bagmati, profile: RIM, urban_profile: METRO}
  # Kageshwari-Manohara: relation id to resolve [V]; until then rule 4 applies there.

area_types:
  OLD_CORE: METRO  # a dense cell outside every curated zone (W2_DESIGN 2.1 rule 4 has no Newar default)
  URBAN: METRO
  PERI_URBAN: RIM
  RURAL: RIM
  HILL: RIM
  FOREST: RIM
  UNKNOWN: RIM
