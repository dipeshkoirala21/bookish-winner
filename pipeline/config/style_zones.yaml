# Regional building style zones (docs/W2_DESIGN.md section 2.1, work item D19).
#
# Read by ghumante_pipeline/style.py. A building's StyleProfile (model.StyleProfile)
# is the FIRST match of:
#
#   1. `zones` below, in list order (curated historic cores, Thamel, the Boudha kora).
#      Stage 1 seeds them from archetype_zones.yaml `newar_core` rectangles plus the
#      Thamel rectangle and the Boudha kora circle; stage 2 replaces the rectangles with
#      polygons traced on the real historic cores [V traced by a reviewer].
#   2. `newar_towns`: a circle around the OSM place=* node of each listed Newar town
#      without a traced zone (towns 400 m, villages 250 m). Profile `kirtipur`, or
#      `khokana` for a village circle holding fewer than `village_small_buildings`.
#   3. `municipalities`: OSM boundary=administrative admin_level=7 relations, matched
#      BY RELATION ID ONLY (names are wrong on some, CONTENT_COVERAGE P6). `profile`
#      is used everywhere inside; `urban_profile` only in URBAN / OLD_CORE area-type
#      cells (else `profile`).
#   4. `area_types`: the 250 m area-type grid (street_life 1.1; areatype.py).
#
# Shapes are WGS84: `rect: [lon_min, lat_min, lon_max, lat_max]`,
# `circle: [lon, lat, radius_m]` or `polygon: [[lon, lat], ...]`.
# `old_core: true` also makes the zone an OLD_CORE area-type core (areatype.py), the
# curated old-core list of street_life 1.3 / roads 1.2.
version: 1

zones:
  # Thamel first: it borders the Kathmandu core rectangle (H App. A).
  - {id: thamel, profile: THAMEL, rect: [85.306, 27.712, 85.316, 27.719]}
  - {id: boudha_kora, profile: BOUDHA_KORA, circle: [85.3620, 27.7215, 350]}
  # Kathmandu: Durbar Square, Indra Chowk, Asan, Kilagal, Jaisi Dewal, Wotu (archetype_zones newar_core).
  - {id: kathmandu_core, profile: KATHMANDU_CORE, old_core: true,
     polygon: [[85.3020, 27.6990], [85.3090, 27.6975], [85.3140, 27.6990], [85.3155, 27.7050],
               [85.3150, 27.7105], [85.3090, 27.7115], [85.3040, 27.7105], [85.3015, 27.7050]]}
  - {id: patan_core, profile: PATAN, old_core: true, rect: [85.3180, 27.6650, 85.3320, 27.6800]}
  - {id: bhaktapur_core, profile: BHAKTAPUR, old_core: true, rect: [85.4190, 27.6690, 85.4400, 27.6760]}
  - {id: kirtipur_core, profile: KIRTIPUR, old_core: true, rect: [85.2720, 27.6740, 85.2840, 27.6820]}
  - {id: thimi_core, profile: THIMI, old_core: true, rect: [85.3810, 27.6760, 85.3920, 27.6860]}
  - {id: bungamati_core, profile: BUNGAMATI, old_core: true, rect: [85.2960, 27.6220, 85.3050, 27.6300]}
  - {id: khokana_core, profile: KHOKANA, old_core: true, rect: [85.2910, 27.6330, 85.2990, 27.6410]}
  - {id: sankhu_core, profile: KIRTIPUR, old_core: true, rect: [85.4620, 27.7220, 85.4760, 27.7340]}
  - {id: panauti_core, profile: PANAUTI, old_core: true, rect: [85.5090, 27.5780, 85.5230, 27.5900]}

newar_towns:
  village_small_buildings: 1500
  town_radius_m: 400
  village_radius_m: 250
  # Names are matched (case-insensitive) against the place's default and English names,
  # nearest to `near` within 3 km, so a same-named hamlet elsewhere is never picked.
  places:
    - {name: Bode, near: [85.398, 27.692]}
    - {name: Chapagaun, near: [85.329, 27.597]}
    - {name: Pharping, near: [85.264, 27.612]}
    - {name: Thecho, near: [85.318, 27.613]}
    - {name: Sunakothi, near: [85.320, 27.632]}
    - {name: Harisiddhi, near: [85.338, 27.645]}
    - {name: Lubhu, near: [85.380, 27.645]}
    - {name: Siddhipur, near: [85.365, 27.650]}
    - {name: Tokha, near: [85.328, 27.760]}
    - {name: Banepa, near: [85.522, 27.632]}
    - {name: Dhulikhel, near: [85.557, 27.621]}

municipalities:
