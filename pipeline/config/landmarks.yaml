# Hero landmarks from the project brief (section 4.4).
#
# `near: [lon, lat, radius_km]` (approximate, hand-entered) restricts candidates
# so that common names like "Barahi" resolve to the right object.
# `match` is a case-insensitive regex tested against name, name:en, name:ne,
# alt_name, int_name, old_name and official_name. `prefer` lists tag filters
# ("key=value", "key=*") that rank candidates. Run
#   python -m ghumante_pipeline.landmarks --pbf data/raw/osm/nepal.osm.pbf
# to resolve each entry to concrete OSM objects. The result is written to
# docs/reports/landmarks.md and config/landmarks.resolved.json.
#
# region: the delivery region the landmark ships in (see config/regions.yaml).
# kind: drives the hero-asset spec in docs/ASSET_MANIFEST.md.
# osm: pins the resolution to one OSM object ("n123", "w123", "r123") when the
#   tag ranking picks the wrong candidate; it must still match `match` and `near`.
# aliases: extra names people search for (build.py indexes them as search keys
#   of the landmark's entry, like alt_name).

landmarks:
  # ---------------------------------------------------------------- Kathmandu Valley
  - {id: boudhanath, region: kathmandu_valley, kind: stupa, match: "bou?d+h?a(nath)?|baudha|bouddha|बौद्ध", prefer: ["man_made=stupa", "building=stupa", "amenity=place_of_worship", "historic=*"], near: [85.362, 27.721, 3], aliases: ["Boudha", "Boudhanath", "Bouddhanath", "Boudha Stupa", "Boudhanath Stupa"]}
  - {id: swayambhunath, region: kathmandu_valley, kind: stupa, match: "swa?yambhu|स्वयम्भू", prefer: ["man_made=stupa", "amenity=place_of_worship", "historic=*", "tourism=attraction"], near: [85.29, 27.715, 3], aliases: ["Swayambhu", "Swayambhu Stupa", "Swayambhunath Stupa", "Monkey Temple"]}
