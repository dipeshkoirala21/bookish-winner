# Unity game: compile check (always), EditMode tests, Android AAB + iOS Xcode builds (GameCI), then
# TestFlight via fastlane on macOS and, optionally, the Play internal track.
#
# Jobs that need a Unity licence or store credentials SKIP with a notice when the secrets are absent
# (forks, fresh repositories); the compile check and API audit run everywhere. Secrets cannot be read in
# a job-level `if`, so the check-secrets job turns their presence into outputs. See docs/CI_SECRETS.md.
name: unity

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "tools/unity-compile-check/**"
      - ".github/workflows/unity.yml"
  pull_request:
    paths:
      - "game/**"
      - "tools/unity-compile-check/**"
      - ".github/workflows/unity.yml"
  workflow_dispatch:
    inputs:
      development:
        description: "Development build (profiler, debug HUD)"
        type: boolean
        default: false
      testflight:
        description: "Upload the iOS build to TestFlight"
        type: boolean
        default: true
      play_internal:
        description: "Upload the AAB to the Play internal track"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: game

jobs:
  check-secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      unity: ${{ steps.check.outputs.unity }}
      unity-version: ${{ steps.version.outputs.unity-version }}
      android-keystore: ${{ steps.check.outputs.android-keystore }}
      ios-release: ${{ steps.check.outputs.ios-release }}
      play-upload: ${{ steps.check.outputs.play-upload }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: game/ProjectSettings/ProjectVersion.txt
          sparse-checkout-cone-mode: false

      - name: Editor version from ProjectVersion.txt
        id: version
        run: |
          version="$(sed -n 's/^m_EditorVersion: //p' game/ProjectSettings/ProjectVersion.txt | tr -d '\r')"
          if [ -z "$version" ]; then echo "::error::Cannot read m_EditorVersion"; exit 1; fi
          echo "unity-version=$version" >> "$GITHUB_OUTPUT"
          echo "Unity editor: $version (GameCI image unityci/editor:ubuntu-$version-<platform>-3)"

      - name: Which secrets are configured
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          has() { [ -n "${!1:-}" ]; }
          flag() { if "$@"; then echo true; else echo false; fi; }

          unity=$(flag eval 'has UNITY_EMAIL && has UNITY_PASSWORD && { has UNITY_LICENSE || has UNITY_SERIAL; }')
          keystore=$(flag eval 'has ANDROID_KEYSTORE_BASE64 && has ANDROID_KEYSTORE_PASS && has ANDROID_KEYALIAS_NAME && has ANDROID_KEYALIAS_PASS')
          ios=$(flag eval 'has APPSTORE_KEY_ID && has APPSTORE_ISSUER_ID && has APPSTORE_P8 && has APPLE_TEAM_ID')
          play=$(flag eval 'has PLAY_SERVICE_ACCOUNT_JSON')
          {
            echo "unity=$unity"
            echo "android-keystore=$keystore"
            echo "ios-release=$ios"
            echo "play-upload=$play"
          } >> "$GITHUB_OUTPUT"

          [ "$unity" = true ] || echo "::notice title=Unity jobs skipped::No Unity licence secrets (UNITY_EMAIL, UNITY_PASSWORD and UNITY_LICENSE or UNITY_SERIAL). Tests and builds are skipped; the compile check still runs. See docs/CI_SECRETS.md."
          [ "$keystore" = true ] || echo "::notice title=Debug-signed AAB::No Android upload keystore secrets; the AAB is signed with Unity's debug key (installable via bundletool, rejected by Play Console)."
          [ "$ios" = true ] || echo "::notice title=TestFlight skipped::No App Store Connect API key / team secrets; the iOS job stops at the Xcode project artifact."
          {
            echo "### Secrets"
            echo "| Capability | Configured |"
            echo "|---|---|"
            echo "| Unity licence (tests, builds) | $unity |"
            echo "| Android upload keystore | $keystore |"
            echo "| App Store Connect (TestFlight) | $ios |"
            echo "| Play service account (internal track) | $play |"
          } >> "$GITHUB_STEP_SUMMARY"

  compile-check:
    name: Compile check + Unity 6.3 API audit (no licence)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache Unity reference sources (audit) and NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            tools/unity-compile-check/.cache
            ~/.nuget/packages
          key: compile-check-${{ hashFiles('game/ProjectSettings/ProjectVersion.txt', 'tools/unity-compile-check/**/*.csproj', 'tools/unity-compile-check/*.props') }}
          restore-keys: compile-check-

      - name: Compile game C# (Android + iOS defines) and audit every Unity API used
        run: tools/unity-compile-check/run.sh --audit

  test:
    name: EditMode tests
    needs: check-secrets
    if: needs.check-secrets.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-test-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ needs.check-secrets.outputs.unity-version }}
          customImage: unityci/editor:ubuntu-${{ needs.check-secrets.outputs.unity-version }}-base-3
          testMode: editmode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode test results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: [check-secrets, test]
    if: needs.check-secrets.outputs.unity == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: Android
            image: android
          - targetPlatform: iOS
            image: ios
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # semantic versioning counts commits since the last tag

      - name: Free disk space (Unity Android images are large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/cache@v6
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('game/Assets/**', 'game/Packages/**', 'game/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - uses: game-ci/unity-builder@v4
        id: build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ needs.check-secrets.outputs.unity-version }}
          customImage: unityci/editor:ubuntu-${{ needs.check-secrets.outputs.unity-version }}-${{ matrix.image }}-3
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: Ghumante.EditorTools.BuildScript.BuildFromCommandLine
          # unity-builder does not forward arbitrary env vars into its container, so settings travel as
          # flags that ProjectSetup/BuildScript read (an empty value means "use the default").
          customParameters: >-
            -ghumanteBundleId ${{ vars.GHUMANTE_BUNDLE_ID }}
            -appleTeamId ${{ secrets.APPLE_TEAM_ID }}
            ${{ inputs.development && '-developmentBuild' || '' }}
          versioning: Semantic
          androidExportType: androidAppBundle
          androidSymbolType: public
          # All four keystore secrets or none: a partial set falls back to the debug key, as announced by
          # check-secrets, instead of failing half-way through signing.
          androidKeystoreName: ${{ needs.check-secrets.outputs.android-keystore == 'true' && 'upload.keystore' || '' }}
          androidKeystoreBase64: ${{ needs.check-secrets.outputs.android-keystore == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          androidKeystorePass: ${{ needs.check-secrets.outputs.android-keystore == 'true' && secrets.ANDROID_KEYSTORE_PASS || '' }}
          androidKeyaliasName: ${{ needs.check-secrets.outputs.android-keystore == 'true' && secrets.ANDROID_KEYALIAS_NAME || '' }}
          androidKeyaliasPass: ${{ needs.check-secrets.outputs.android-keystore == 'true' && secrets.ANDROID_KEYALIAS_PASS || '' }}

      - name: Build summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.targetPlatform }}"
            echo "- version: ${{ steps.build.outputs.buildVersion }} (code ${{ steps.build.outputs.androidVersionCode }})"
            echo "- engine exit code: ${{ steps.build.outputs.engineExitCode }}"
            echo '```'
            du -sh build/${{ matrix.targetPlatform }}/* 2>/dev/null || echo "no build output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
          retention-days: 14
          # The AAB is already compressed; the Xcode project is not, so let the default level handle it.
          compression-level: ${{ matrix.targetPlatform == 'Android' && 0 || 6 }}

  testflight:
    name: TestFlight (fastlane, macOS)
    needs: [check-secrets, build]
    if: >-
      needs.check-secrets.outputs.ios-release == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.testflight))
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      IOS_BUILD_PATH: ${{ github.workspace }}/build/iOS
      IOS_BUNDLE_ID: ${{ vars.GHUMANTE_BUNDLE_ID || 'com.ghumante.game' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
      MATCH_REPOSITORY: ${{ secrets.MATCH_REPOSITORY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-iOS
          path: build/iOS

      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK since 2026-04-28)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: game

      - name: Prepare the Unity export
        run: |
          # Artifacts do not keep the executable bit; Unity's build phase scripts need it.
          find "$IOS_BUILD_PATH" -type f -name "*.sh" -exec chmod +x {} \;
          find "$IOS_BUILD_PATH" -type f -iname "usymtool*" -exec chmod +x {} \;
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q iphoneos; then xcodebuild -downloadPlatform iOS; fi

      - name: Load the match deploy key
        if: env.MATCH_DEPLOY_KEY != ''
        run: |
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$MATCH_DEPLOY_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: fastlane ios beta
        working-directory: game
        run: bundle exec fastlane ios beta

  play-internal:
    name: Play internal track (optional)
    needs: [check-secrets, build]
    if: >-
      needs.check-secrets.outputs.play-upload == 'true' &&
      needs.check-secrets.outputs.android-keystore == 'true' &&
      github.event_name == 'workflow_dispatch' && inputs.play_internal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-Android
          path: build/Android

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: game

      - name: fastlane android internal
        working-directory: game
        env:
          ANDROID_PACKAGE_NAME: ${{ vars.GHUMANTE_BUNDLE_ID || 'com.ghumante.game' }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          aab="$(find "$GITHUB_WORKSPACE/build/Android" -name '*.aab' | head -n 1)"
          if [ -z "$aab" ]; then echo "::error::No .aab in the build-Android artifact"; exit 1; fi
          ANDROID_AAB_PATH="$aab" bundle exec fastlane android internal
